name: 🌍 FloodLink GFS 6h Rainfield Export

on:
  schedule:
    # GFS 0.25° is updated every 6h; running every 3h is a good compromise.
    # If you want hourly, change to "0 */1 * * *"
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# avoid concurrent runs stepping on each other
concurrency:
  group: floodlink-gfs-rainfield
  cancel-in-progress: true

jobs:
  export-rainfield:
    runs-on: ubuntu-latest

    env:
      # 👇 force unbuffered stdout so logs stream live
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # allow pull/rebase/push

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: ⚙️ Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pygrib numpy

      - name: 🌧️ Generate global 6h rainfield JSON
        run: |
          echo "Starting GFS 6h rainfield export..."
          python -u gfs_rainfield_6h.py

      - name: 💾 Commit and push updated rainfield JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1) Sync with remote, autostashing local JSON edits
          git fetch origin
          git pull --rebase --autostash origin main

          # 2) Add the rainfield JSON (and any future variants)
          git add gfs_rain_6h.json || true

          # 3) Commit only if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "🌍 Auto-update: GFS 6h global rainfield ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push origin main
          else
            echo "No rainfield JSON changes to commit."
          fi
