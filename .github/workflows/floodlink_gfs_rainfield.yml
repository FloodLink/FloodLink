name: 🌍 FloodLink GFS 1h Rainfield + Isocurves

on:
  schedule:
    # GFS 0.25° is updated every 6h; running every 1h keeps us fresh enough
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# avoid concurrent runs stepping on each other
concurrency:
  group: floodlink-gfs-rainfield
  cancel-in-progress: true

jobs:
  export-rainfield:
    runs-on: ubuntu-latest

    env:
      # 👇 force unbuffered stdout so logs stream live
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # allow pull/rebase/push

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: ⚙️ Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pygrib numpy matplotlib

      - name: 🌧️ Generate global 1h rain time-series + isocurves
        run: |
          echo "Starting GFS 1h rainfield time-series export (with isocurves)..."
          python -u livefloodengine_gfs_export_rainfield.py

      - name: 💾 Commit and push updated rainfield JSON + isocurves
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1) Sync with remote
          git fetch origin
          git pull --rebase --autostash origin main

          # 2) Stage outputs (JSON + GeoJSON + textures folder)
          git add gfs_rain_6h.json gfs_rain_isolines_6h.geojson gfs_rain_6h_textures || true

          # 3) Commit only if there are staged changes
          if git diff --cached --quiet; then
            echo "No rainfield / isocurve / texture changes to commit."
          else
            git commit -m "🌍 Auto-update: GFS 1h rainfield + isocurves + textures ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push origin main
          fi

