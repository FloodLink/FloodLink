name: 🌍 FloodLink Cluster-NOAA Live Risk Engine 

on:
  schedule:
    - cron: "0 */1 * * *"   # every 1 hour
  workflow_dispatch:

permissions:
  contents: write

# avoid concurrent runs stepping on each other
concurrency:
  group: floodlink-live-cluster
  cancel-in-progress: true

jobs:
  run-floodlink:
    runs-on: ubuntu-latest
    
    env:
      # 👇 force unbuffered stdout so logs stream live
      PYTHONUNBUFFERED: "1"

      # ✅ enable live tweets (set to "false" for dry runs)
      TWITTER_ENABLED: "true"
      
      # ⚠️ Use GitHub Secrets for keys
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY2 }}
      TWITTER_SECRET: ${{ secrets.TWITTER_SECRET2 }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN2 }}
      TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET2 }}

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # allow pull/rebase/push

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tweepy tzdata pygrib numpy scipy

      - name: 🌧️ Run FloodLink Cluster Engine
        run: |
          echo "Starting live flood risk evaluation (cluster version)..."
          echo "TWITTER_ENABLED=$TWITTER_ENABLED"
          python -u livefloodengine_cluster.py

      - name: 💾 Commit and push updated alerts JSON (cluster)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1) Sync with remote, autostashing local JSON edits
          git fetch origin
          git pull --rebase --autostash origin main
          
          # 2) Always add the main cluster JSON files
          git add alerts_comparison_cluster.json tweeted_alerts_cluster.json map_alerts.json || true
          
          # 3) Add snapshot files if they exist (cluster versions)
          if ls alerts_comparison_cluster_*.json 1> /dev/null 2>&1; then
            git add alerts_comparison_cluster_*.json
          fi
          
          # 4) Commit only if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "🌧️ Auto-update: cluster flood risk alerts ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push origin main
          else
            echo "No JSON changes to commit."
          fi
