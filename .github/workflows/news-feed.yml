name: 👾 FloodLink – Global Flood Early Warning Agent

on:
  schedule:
    # Runs roughly every 50 minutes, like your construction bot
    - cron: "*/50 * * * *"
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write  # Needed to commit JSON logs

concurrency:
  group: floodlink-agent
  cancel-in-progress: true

jobs:
  post_news:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4

      - name: 🏗️ Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tweepy>=4.14.0 openai feedparser requests
        
      - name: 📄 Initialize Log Files
        run: |
          [ -f floodlink_news.json ]                  || echo '[]'   > floodlink_news.json
          [ -f floodlink_replies.json ]                || echo '{}'   > floodlink_replies.json
          [ -f floodlink_target_engagement.json ]      || echo '{}'   > floodlink_target_engagement.json
          [ -f floodlink_mentions_reply_log.json ]     || echo '{}' > floodlink_mentions_reply_log.json
          [ -f last_mentions_check.txt ]       || echo "0"   > last_mentions_check.txt

          echo "All FloodLink log files ready"

      - name: 🚀 Run FloodLink Agent
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_SECRET: ${{ secrets.TWITTER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}  # 🔴 NEW – needed for bearer_client
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}               # (safe to pass, even if not used yet)
        run: python news-feed.py

      - name: 🔄 Commit and Push FloodLink Logs
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Add ALL possible log files
          git add floodlink_news.json || true
          git add floodlink_replies.json || true
          git add floodlink_target_engagement.json || true
          git add floodlink_mentions_reply_log.json || true
          git add last_mentions_check.txt || true

          # Only commit if something changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update logs: news, replies, and engagement tweets [Automated]"
            git push origin main
          fi
