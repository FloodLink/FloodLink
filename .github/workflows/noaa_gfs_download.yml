name: 🌧️ FloodLink GFS 1h Rainfield (6h JSON + CUM)

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floodlink-gfs-rainfield
  cancel-in-progress: true

jobs:
  export-rainfield:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: ⚙️ Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pygrib numpy

      - name: 🌧️ Generate global 1h rain time-series + 6h cumulative
        run: |
          echo "Starting GFS 1h rainfield export (6h window + cum only)..."
          python -u livefloodengine_gfs_export_rainfield.py

      - name: 💾 Commit and push updated rainfield JSONs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git pull --rebase --autostash origin main

          # Stage only outputs you still generate
          git add gfs_rain_6h.json gfs_rain_6h_cum.json || true

          if git diff --cached --quiet; then
            echo "No rainfield/cum changes to commit."
          else
            git commit -m "🌍 Auto-update: GFS rainfield + cum ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push origin main
          fi
